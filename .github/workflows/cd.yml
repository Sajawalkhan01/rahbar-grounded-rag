name: cd

# On every push to main (that is, after a reviewed pull request is merged): test, publish the
# images tagged with the commit SHA, deploy that exact SHA, verify the rollout, and smoke test
# through the Ingress. Each stage needs the one before it, so broken code is never published
# and an unpublished image is never deployed.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: cd api && pytest -q --cov=app --cov-fail-under=60
      - run: cd indexer && pytest -q
      - run: pytest -q tests

  build-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - {name: api, context: api, file: api/Dockerfile}
          - {name: indexer, context: ., file: indexer/Dockerfile}
          - {name: ui, context: ui, file: ui/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # A Docker Hub ACCESS TOKEN (never the account password), stored as a GitHub secret.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tagged with the commit SHA only. There is no :latest anywhere in this repository.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-${{ matrix.name }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx==0.28.1 pyyaml==6.0.2
      # An ephemeral cluster with the ports an Ingress needs.
      - name: Create a kind cluster with an ingress port
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: rahbar
          config: .github/kind-config.yaml
      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
      - name: Start Ollama with the pinned embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer also starts a service bound to 127.0.0.1, which a kind pod cannot reach
          # and which would keep our own server off the port. Stop it, then listen on all interfaces.
          sudo systemctl stop ollama || true
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 2; done
          ollama pull nomic-embed-text
      - name: Deploy this commit (images pulled from Docker Hub by SHA)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # The IPv4 gateway of the kind network (the first entry can be IPv6), where Ollama listens.
          GATEWAY=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | grep -oE '([0-9]+[.]){3}[0-9]+' | head -1)
          echo "Ollama gateway: ${GATEWAY}"; curl -sf "http://${GATEWAY}:11434/api/version"
          kubectl kustomize k8s/overlays/smoke \
            | sed -e "s#DOCKERHUB_USER#${DOCKERHUB_USERNAME}#g" \
                  -e "s#REPLACE_SHA#${GITHUB_SHA}#g" \
                  -e "s#http://host.minikube.internal:11434#http://${GATEWAY}:11434#" \
            > /tmp/rendered.yaml
          grep -E "image: .*rahbar-" /tmp/rendered.yaml | sort -u
          if grep -E "image: .*:latest" /tmp/rendered.yaml; then echo "refusing to deploy :latest"; exit 1; fi
          kubectl apply -f /tmp/rendered.yaml
      - name: Verify the rollout
        run: |
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=15m || {
            kubectl logs job/indexer -n rahbar --all-containers --tail=100; exit 1; }
          kubectl rollout status statefulset/chroma -n rahbar --timeout=5m
          kubectl rollout status deployment/redis -n rahbar --timeout=5m
          kubectl rollout status deployment/api -n rahbar --timeout=5m
          kubectl rollout status deployment/ui -n rahbar --timeout=5m
          kubectl get pods,endpoints,hpa -n rahbar
          kubectl get deployment api -n rahbar -o jsonpath='{.spec.template.spec.containers[0].image}'
      - name: Smoke test through the Ingress
        run: |
          curl -sf -H "Host: rahbar.local" http://localhost/ | grep -qi "<title>"
          curl -sf -H "Host: rahbar.local" http://localhost/api/ask -X POST \
            -H 'Content-Type: application/json' \
            -d '{"question": "When is a student placed on academic warning?"}' | tee /tmp/answer.json
          python - <<'PY'
          import json
          body = json.load(open("/tmp/answer.json"))
          assert body["answered_from_context"] and body["citations"], body
          print("answered with", len(body["citations"]), "citation(s)")
          PY
          python eval/run_eval.py --api http://localhost --host rahbar.local \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.fixture.json --out /tmp/fixture-results.json
      - name: Show the cluster on failure
        if: failure()
        run: |
          kubectl get pods -n rahbar -o wide || true
          kubectl describe pods -n rahbar | tail -80 || true
