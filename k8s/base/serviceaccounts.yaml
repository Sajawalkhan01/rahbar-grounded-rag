# One ServiceAccount per workload, none of them mounting an API token: no pod here ever
# talks to the Kubernetes API, so a compromised container has no credentials to steal.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ui, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: chroma, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: indexer, namespace: rahbar}
automountServiceAccountToken: false
