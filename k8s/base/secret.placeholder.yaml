# Documents the SHAPE of the Secret only. NEVER list this file in kustomization.yaml: applying
# it would overwrite the real Secret with this placeholder. Create the real one from the
# command line, never from a file:
#
#   export LLM_API_KEY=...            # only needed when LLM_PROVIDER=hosted
#   make secret
#
# which runs: kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
