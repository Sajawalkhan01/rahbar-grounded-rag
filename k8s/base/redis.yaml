# The semantic cache and conversation turns. Persistence: appendonly file on a PVC, so cached
# answers survive a pod restart (they are keyed by index_id, so a re-index still invalidates
# them: api/app/services/cache.py). Only the api may connect (NetworkPolicy).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: rahbar
  labels: {app: redis}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rahbar
  labels: {app: redis, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  strategy:
    type: Recreate         # a ReadWriteOnce volume cannot be held by two pods during a rollout
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          args: ["--appendonly", "yes", "--dir", "/data", "--save", ""]
          ports:
            - {name: redis, containerPort: 6379}
          startupProbe:
            exec: {command: ["redis-cli", "ping"]}
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 20
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rahbar
  labels: {app: redis}
spec:
  type: ClusterIP
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
