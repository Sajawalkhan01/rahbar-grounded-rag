apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: rahbar
  labels: {app: ui, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ui}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: ui, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: ui
      # Kubernetes would inject CHROMA_PORT=tcp://... for the Service named chroma; Chroma reads
      # every CHROMA_* variable as its own config and panics. No pod here uses service links.
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: rahbar-ui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # nginx writes its pid and temp files here only
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: rahbar
  labels: {app: ui}
spec:
  type: ClusterIP
  selector: {app: ui}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
